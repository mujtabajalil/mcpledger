[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpledger"
version = "0.1.0"
description = "Inventory, allowlist and drift alerts for the MCP servers and agent skills on your team's machines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "MCPLedger" }]
keywords = ["mcp", "model context protocol", "agent skills", "security", "claude code", "cursor", "supply chain"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Security",
  "Intended Audience :: Developers",
]
# Deliberately zero runtime dependencies: a supply-chain tool should not
# pull in a supply chain of its own.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpledger = "mcpledger.cli:main"

[project.urls]
Homepage = "https://mcpledger.dev"

[tool.setuptools.packages.find]
where = ["src"]
