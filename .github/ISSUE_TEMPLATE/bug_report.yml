name: Bug report
description: Something in the CLI, server or dashboard doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues go through [private reporting](https://github.com/mujtabajalil/mcpledger/security/advisories/new), not here.**
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, Server / API, Dashboard, Docker / deployment, Docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran and the output. Redact hostnames or tokens you don't want public.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`mcpledger --version`, OS, Python version, and the server version or commit if relevant."
    validations:
      required: true
