# Publishes the CLI to PyPI when you push a tag like cli-v0.1.0.
# One-time: on pypi.org add a "trusted publisher" for this repo + workflow (no API token needed).
name: release-cli
on:
  push:
    tags: ["cli-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && cd cli && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: cli/dist }
