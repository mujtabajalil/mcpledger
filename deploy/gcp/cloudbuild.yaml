# Test -> build -> push -> migrate -> deploy.
# Manual run:   gcloud builds submit --config deploy/gcp/cloudbuild.yaml \
#                 --service-account projects/$PROJECT_ID/serviceAccounts/mcpledger-build@$PROJECT_ID.iam.gserviceaccount.com \
#                 --substitutions _PUBLIC_URL=https://app.example.com .
# Or attach it to a GitHub trigger (see the deployment plan).
substitutions:
  _REGION: us-central1
  _REPO: mcpledger
  _SERVICE: mcpledger
  _DB_INSTANCE: mcpledger-db
  _PUBLIC_URL: ""            # e.g. https://app.mcpledger.dev (required)
  _PADDLE_ENV: sandbox       # switch to "production" when you go live
  _PADDLE_CLIENT_TOKEN: ""   # client-side token, safe to expose
  _PADDLE_PRICE_TEAM: ""
  _PADDLE_PRICE_BUSINESS: ""
  _MIN_INSTANCES: "0"        # set to 1 to remove cold starts (~$10-15/month more)

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install -q -r server/requirements.txt ./cli pytest
        (cd cli && pytest -q)
        (cd server && pytest -q -p no:warnings)

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcpledger:$BUILD_ID", "-t",
           "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcpledger:latest", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcpledger"]

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        CONN=$$(gcloud sql instances describe ${_DB_INSTANCE} --format='value(connectionName)')
        gcloud run jobs deploy ${_SERVICE}-migrate \
          --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcpledger:$BUILD_ID \
          --service-account mcpledger-run@$PROJECT_ID.iam.gserviceaccount.com \
          --set-cloudsql-instances $$CONN \
          --set-secrets DATABASE_URL=mcpledger-database-url:latest \
          --command alembic --args upgrade,head \
          --max-retries 0 --task-timeout 300
        gcloud run jobs execute ${_SERVICE}-migrate --region ${_REGION} --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if [ -z "${_PUBLIC_URL}" ]; then echo "Set _PUBLIC_URL"; exit 1; fi
        CONN=$$(gcloud sql instances describe ${_DB_INSTANCE} --format='value(connectionName)')
        gcloud run deploy ${_SERVICE} \
          --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcpledger:$BUILD_ID \
          --service-account mcpledger-run@$PROJECT_ID.iam.gserviceaccount.com \
          --add-cloudsql-instances $$CONN \
          --set-secrets DATABASE_URL=mcpledger-database-url:latest,PADDLE_WEBHOOK_SECRET=mcpledger-paddle-webhook-secret:latest \
          --set-env-vars "^@^DEPLOYMENT_MODE=cloud@PUBLIC_URL=${_PUBLIC_URL}@ALLOWED_ORIGINS=${_PUBLIC_URL}@PADDLE_ENV=${_PADDLE_ENV}@PADDLE_CLIENT_TOKEN=${_PADDLE_CLIENT_TOKEN}@PADDLE_PRICE_TEAM=${_PADDLE_PRICE_TEAM}@PADDLE_PRICE_BUSINESS=${_PADDLE_PRICE_BUSINESS}" \
          --allow-unauthenticated \
          --cpu 1 --memory 512Mi --concurrency 80 \
          --min-instances ${_MIN_INSTANCES} --max-instances 10 \
          --timeout 60 --cpu-boost
        gcloud run services describe ${_SERVICE} --region ${_REGION} --format='value(status.url)'

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/mcpledger:$BUILD_ID
